syntax = "proto3";
package dshguest.v1;
option go_package = "github.com/Exagone313/dsh-podman/internal/genproto/dshguest/v1;dshguestv1";

import "google/protobuf/wrappers.proto";

service WorkspaceGuestAgent {
  // Ping reports that the agent is reachable and accepts the caller's
  // credential. Callers use it as a readiness probe before issuing work.
  rpc Ping(PingRequest) returns (PingResponse);
  rpc Exec(stream ExecInput) returns (stream ExecOutput);
  rpc Signal(SignalRequest) returns (SignalResponse);
  rpc ReadFile(ReadFileRequest) returns (stream ReadFileChunk);
  rpc WriteFile(stream WriteFileChunk) returns (WriteFileResponse);
  rpc Stat(StatRequest) returns (StatResponse);
  rpc ReadDir(ReadDirRequest) returns (ReadDirResponse);
  rpc Mkdir(MkdirRequest) returns (MkdirResponse);
  rpc Delete(DeleteRequest) returns (DeleteResponse);
  rpc SetPaths(SetPathsRequest) returns (PathsResponse);
  rpc GetPaths(GetPathsRequest) returns (PathsResponse);
  rpc StartDaemon(StartDaemonRequest) returns (DaemonInfo);
  rpc ListDaemons(ListDaemonsRequest) returns (ListDaemonsResponse);
  rpc StopDaemon(StopDaemonRequest) returns (StopDaemonResponse);
  rpc StopAllDaemons(StopAllDaemonsRequest) returns (StopAllDaemonsResponse);
  rpc RestartDaemon(RestartDaemonRequest) returns (DaemonInfo);
  rpc DaemonLogs(DaemonLogsRequest) returns (DaemonLogsResponse);
  rpc PublishPort(PublishPortRequest) returns (PublishPortResponse);
  rpc UnpublishPort(UnpublishPortRequest) returns (UnpublishPortResponse);
  rpc Terminal(stream TerminalInput) returns (stream TerminalOutput);
}
message PingRequest {}
message PingResponse { string version = 1; string commit = 2; }
// stdin and control have independent write halves. Closing the request stream
// remains an EOF for both, for callers that do not multiplex input channels.
message ExecInput { oneof payload { ExecStart start = 1; bytes stdin_chunk = 2; bytes control_chunk = 3; bool stdin_eof = 4; bool control_eof = 5; } }
message ExecStart { repeated string argv = 1; string cwd = 2; map<string, string> env = 3; repeated string unset_env = 4; SpillTarget spill_stdout = 5; SpillTarget spill_stderr = 6; google.protobuf.Int32Value uid = 7; google.protobuf.Int32Value gid = 8; repeated uint32 groups = 9; bool stdin_pipe = 10; bool control_pipe = 11; }
// control_ready acknowledges the requested descriptor in the first process-id
// message, so a new client can fail clearly against an older guest agent.
message ExecOutput { oneof payload { bytes stdout_chunk = 1; bytes stderr_chunk = 2; ExecExit exit = 3; bytes control_chunk = 5; bool control_eof = 6; } string process_id = 4; bool control_ready = 7; }
message ExecExit { int32 exit_code = 1; bool signaled = 2; string signal = 3; bool stdout_spill_valid = 4; bool stderr_spill_valid = 5; }
// SpillTarget is a bounded full-stream copy of one output stream, written in
// the guest's execution world so the caller can read the complete output after
// an in-memory truncation.
message SpillTarget { int64 max_bytes = 1; string path = 2; }
message SignalRequest { string process_id = 1; string signal = 2; }
message SignalResponse {}
message ReadFileRequest { string path = 1; int64 offset = 2; int64 length = 3; }
message ReadFileChunk { bytes data = 1; }
message WriteFileChunk { oneof payload { WriteFileStart start = 1; bytes data_chunk = 2; } }
message WriteFileStart { string path = 1; bool create = 2; bool truncate = 3; }
message WriteFileResponse { int64 bytes_written = 1; }
message StatRequest { string path = 1; bool no_follow = 2; }
message StatResponse { bool exists = 1; bool is_dir = 2; int64 size = 3; string mode = 4; string modified_at = 5; bool is_symlink = 6; }
message ReadDirRequest { string path = 1; }
message ReadDirResponse { repeated DirEntry entries = 1; }
message DirEntry { string name = 1; bool is_dir = 2; int64 size = 3; string type = 4; }
message MkdirRequest { string path = 1; bool parents = 2; }
message MkdirResponse {}
message DeleteRequest { string path = 1; bool recursive = 2; }
message DeleteResponse {}
// Path additions the agent prepends to every child's PATH, highest priority
// first. default_path is the agent's own PATH (the container image's), which
// the additions are prepended to.
message SetPathsRequest { repeated string paths = 1; }
message GetPathsRequest {}
message PathsResponse { repeated string paths = 1; string default_path = 2; }
message StartDaemonRequest { string name = 1; repeated string argv = 2; string cwd = 3; map<string, string> env = 4; google.protobuf.Int32Value uid = 5; google.protobuf.Int32Value gid = 6; repeated uint32 groups = 7; google.protobuf.BoolValue inherit_env = 8; }
message DaemonInfo { string name = 1; repeated string argv = 2; bool running = 3; int32 exit_code = 4; string started_at = 5; string stopped_at = 6; uint32 uid = 7; uint32 gid = 8; repeated uint32 groups = 9; }
message ListDaemonsRequest {}
message ListDaemonsResponse { repeated DaemonInfo daemons = 1; }
message StopDaemonRequest { string name = 1; string signal = 2; }
message StopDaemonResponse {}
message StopAllDaemonsRequest {}
message StopAllDaemonsResponse { repeated string daemons = 1; }
message RestartDaemonRequest { string name = 1; }
message DaemonLogsRequest { string name = 1; int32 tail_bytes = 2; }
message DaemonLogsResponse { bytes stdout = 1; bytes stderr = 2; }
message TerminalInput { oneof payload { TerminalStart start = 1; bytes stdin_chunk = 2; TerminalResize resize = 3; TerminalSignal signal = 4; string inspect_request_id = 5; bool close = 6; } }
message TerminalStart { repeated string argv = 1; string cwd = 2; map<string, string> env = 3; uint32 rows = 4; uint32 cols = 5; }
message TerminalResize { uint32 rows = 1; uint32 cols = 2; }
message TerminalSignal { string signal = 1; string request_id = 2; }
message TerminalOutput { oneof payload { TerminalStarted started = 1; bytes stdout_chunk = 2; TerminalExit exit = 3; TerminalForeground foreground = 4; TerminalSignalled signalled = 5; } }
message TerminalStarted { int32 pid = 1; }
message TerminalExit { int32 exit_code = 1; bool signaled = 2; string signal = 3; }
message TerminalForeground { string request_id = 1; bool found = 2; int32 process_group_id = 3; bool input_waiting = 4; }
message TerminalSignalled { string request_id = 1; bool found = 2; int32 process_group_id = 3; }

// Protocol is the transport a published pod port speaks. Only TCP is
// implemented today; the others are reserved so the wire format does not have
// to change when they land.
enum Protocol { PROTOCOL_UNSPECIFIED = 0; PROTOCOL_TCP = 1; PROTOCOL_UDP = 2; PROTOCOL_HTTP = 3; }

// PublishPort makes the agent listen on a Unix socket inside the container's
// socket directory and forward every connection to 127.0.0.1:<port> in the
// pod's network namespace. The socket name is deterministic (see
// internal/guestagent/publish), so publishing again after a recreate lands on
// the same path and the gateway's binding keeps working.
message PublishPortRequest { uint32 port = 1; Protocol protocol = 2; }
message PublishPortResponse { string socket_name = 1; }
message UnpublishPortRequest { uint32 port = 1; Protocol protocol = 2; }
message UnpublishPortResponse {}
